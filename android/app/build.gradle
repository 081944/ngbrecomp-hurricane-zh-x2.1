plugins { id 'com.android.application' }

android {
    namespace 'org.ngb.port'
    compileSdk 35
    defaultConfig {
        applicationId 'org.ngb.port'
        minSdk 30
        targetSdk 35
        versionCode 2
        versionName '0.2.0-zh-x2.1'
        testInstrumentationRunner 'org.ngb.port.DriverInstrumentation'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets {
        main {
            java.srcDir rootProject.file('../build/android-deps/src/SDL/android-project/app/src/main/java')
            jniLibs.srcDir rootProject.file('../build/android-package/jniLibs')
        }
        androidTest { assets.srcDir rootProject.file('../build/android-driver-tests') }
    }
    signingConfigs {
        // Committed on purpose: the published APK has to upgrade over the
        // debug builds and has to be reproducible by anyone who checks out
        // the branch. It is a shared test key, not a secret.
        ngb {
            storeFile rootProject.file('keystore/ngb-android.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.ngb }
        release {
            minifyEnabled false
            signingConfig signingConfigs.ngb
        }
    }
    compileOptions {
        // The Java sources carry the Chinese UI strings; do not let javac
        // fall back to the Windows code page.
        encoding 'UTF-8'
    }
    packaging { jniLibs { useLegacyPackaging true } }
}
